<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUVEQUEST</title>
    
    <!-- Link correto para carregar o CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="header">
        <h1>🎮 JUVEQUEST</h1>
        <p>A Missão dos Direitos da Juventude</p>
    </div>

    <div class="scoreboard">
        <div class="card">
            <h3>🎓 EDUCAÇÃO</h3>
            <span id="education">50</span>
        </div>

        <div class="card">
            <h3>🗳️ PARTICIPAÇÃO</h3>
            <span id="participation">50</span>
        </div>
    </div>

    <div class="mission-box">
        <h2 id="missionTitle"></h2>
        <div id="options"></div>
    </div>

    <button id="nextBtn">
        Próxima Missão
    </button>

    <div id="message"></div>

    <div id="badges"></div>

</div>

<!-- Tag correta para carregar e executar o Javascript -->
<script src="game.js"></script>

</body>
</html>
